<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>用 VSCode 打开</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181818;
        --fg: #ffffff;
        --muted: color-mix(in oklab, #ffffff 52%, transparent);
        --border: color-mix(in oklab, #ffffff 8%, transparent);
        --card: color-mix(in oklab, #ffffff 6%, transparent);
        --accent: #ffffff;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      :root[data-base="light"] {
        color-scheme: light;
        --bg: #fafafa;
        --fg: #1a1c1f;
        --muted: #5d5d5d;
        --border: color-mix(in oklab, #1a1c1f 8%, transparent);
        --card: #ffffff;
        --accent: #1a1c1f;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        padding-top: calc(var(--pi-plugin-titlebar-height, 0px) + 16px);
      }
      .dialog {
        width: min(320px, 100%);
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
      }
      button {
        display: block;
        width: 100%;
        font: inherit;
        color: var(--bg);
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #status {
        min-height: 1.45em;
        margin-top: 10px;
        color: var(--muted);
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <!-- 入口层：对话框里只有一颗按钮，点击立刻打开 -->
    <div class="dialog">
      <button type="button" id="open-btn">用 VSCode 打开当前目录</button>
      <div id="status" role="status"></div>
    </div>
    <script>
      /** 入口层视图脚本：把点击交给主进程。 */
      const button = document.getElementById("open-btn");
      const status = document.getElementById("status");

      /**
       * 把打开结果写到状态行。
       * @param {{ ok?: boolean, dir?: string, message?: string }} result
       */
      function showResult(result) {
        // 成功就展示被打开的目录
        if (result && result.ok) {
          status.textContent = "已打开：" + result.dir;
          return;
        }
        // 失败展示主进程给的说明
        if (result && result.message) {
          status.textContent = result.message;
          return;
        }
        status.textContent = "打开失败。";
      }

      /**
       * 点按钮后立刻打开，不再二次确认。
       */
      async function onClick() {
        button.disabled = true;
        status.textContent = "正在打开…";
        try {
          const result = await window.pluginBridge.invoke("pi-open-in-vscode.open", {});
          showResult(result);
        } catch (error) {
          status.textContent = String(error && error.message ? error.message : error);
        }
        button.disabled = false;
      }

      button.addEventListener("click", function () {
        onClick();
      });
    </script>
  </body>
</html>
